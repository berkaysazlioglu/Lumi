name: CI
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            LumiPackages/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('LumiPackages/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Build
        run: swift build
        working-directory: LumiPackages
      - name: Test
        run: swift test
        working-directory: LumiPackages
