name: Release
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
        working-directory: LumiPackages
      - name: Verify tag matches make-app.sh version
        run: |
          SCRIPT_VERSION="$(sed -n 's/^VERSION="\${VERSION:-\([^}]*\)}"$/\1/p' Scripts/make-app.sh)"
          TAG="${GITHUB_REF_NAME}"
          if [ "v$SCRIPT_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match make-app.sh version v$SCRIPT_VERSION"
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # arm64
          - os: macos-15-intel    # x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Import macOS signing certificate
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          echo "$MAC_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -k $KEYCHAIN_PATH -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db
      - name: Store notarization credentials
        run: |
          xcrun notarytool store-credentials "lumi-notary" --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
      - name: Build, sign and notarize
        run: |
          IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in keychain"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}" IDENTITY="$IDENTITY" NOTARY_PROFILE=lumi-notary ./Scripts/make-app.sh --notarize
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate combined SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.zip *.dmg > "SHA256SUMS-${GITHUB_REF_NAME#v}.txt"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts -maxdepth 1 -type f -print0 | xargs -0 gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes
