name: LumiMobile
options:
  bundleIdPrefix: com.uncosoft
  deploymentTarget:
    iOS: "17.0"
packages:
  LumiMobileKit:
    path: LumiMobileKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    revision: 24a68bcadc479d945c7ca32f21ac0a8ab895c690
schemes:
  LumiMobile:
    build:
      targets:
        LumiMobile: all
        LumiMobileUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LumiMobileUITests
      environmentVariables:
        PAIRING_STRING: $(PAIRING_STRING)

targets:
  LumiMobile:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: LumiMobileKit
      - package: SwiftTerm
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: App/LumiMobile.entitlements
        # Sadece iPhone — iPad çoklu görev orientation kuralı uygulanmaz.
        TARGETED_DEVICE_FAMILY: "1"
        # Dağıtım kimliği (TestFlight / com.uncosoft.lumi).
        PRODUCT_BUNDLE_IDENTIFIER: com.uncosoft.lumi
        # Sürüm/build; make-mobile.sh xcodebuild komut satırından ezer
        # (CURRENT_PROJECT_VERSION = git commit sayısı, MARKETING_VERSION = VERSION env).
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "379"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lumi
        CFBundleName: Lumi
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Yalnız standart şifreleme (HTTPS/WSS) → muaf; TestFlight "Missing Compliance" sormaz.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Eşleştirme QR kodunu okumak için kamera gerekir.
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.uncosoft.lumi.pair
            CFBundleURLSchemes: [lumi-remote]
  LumiMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LumiMobile
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

settings:
  base:
    DEVELOPMENT_TEAM: FX46XZGU7U
    CODE_SIGN_STYLE: Automatic
