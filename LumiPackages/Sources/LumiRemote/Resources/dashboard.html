<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0e14">
<title>Lumi</title>
<style>
  :root {
    --bg-deep: #0d0e14; --bg-surface: #14161f; --bg-elevated: #1c1f2b;
    --border: #262a38; --text: #e8eaf2; --text-2: #9aa0b4; --muted: #6b7089;
    --accent: #7c6cf0; --waiting: #f5a623; --error: #e5484d; --idle: #8b8fa3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg-deep); color: var(--text);
    font: 14px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
    overscroll-behavior: none;
  }
  .view { display: none; height: 100%; flex-direction: column; }
  .view.active { display: flex; }
  header {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background: var(--bg-surface); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 11px; margin-left: auto; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  /* --- Liste --- */
  #list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .card {
    text-align: left; background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
  }
  .card:active { background: var(--bg-elevated); }
  .card .row { display: flex; align-items: center; gap: 8px; }
  .card .name { font-weight: 600; }
  .card .repo { color: var(--text-2); font-size: 12px; }
  .card .task { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { margin-left: auto; font-size: 10px; padding: 2px 8px; border-radius: 20px; border: 1px solid; flex-shrink: 0; }
  .empty { color: var(--muted); text-align: center; margin-top: 40vh; transform: translateY(-50%); }
  /* --- Terminal --- */
  #screenWrap { flex: 1; overflow: auto; background: var(--bg-deep); }
  #screen {
    padding: 10px 12px calc(env(safe-area-inset-bottom) + 8px);
    font-size: 11px; line-height: 1.35; min-width: max-content;
  }
  #history { white-space: pre; color: var(--text-2); }
  #live { white-space: pre; }
  #live > div { min-height: 1.35em; }
  #exitBanner {
    display: none; padding: 8px 14px; background: var(--error); color: #fff;
    font-size: 12px; text-align: center;
  }
  .controls {
    flex-shrink: 0; background: var(--bg-surface); border-top: 1px solid var(--border);
    padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px);
    display: flex; flex-direction: column; gap: 8px;
  }
  .keys { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .keys::-webkit-scrollbar { display: none; }
  .keys button {
    flex-shrink: 0; background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 13px; font-size: 13px; color: var(--text-2);
  }
  .keys button:active { background: var(--accent); color: #fff; }
  .inputRow { display: flex; gap: 8px; align-items: flex-end; }
  #prompt {
    flex: 1; background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; color: var(--text); font: 16px/1.4 inherit;
    resize: none; max-height: 110px; outline: none;
  }
  #prompt:focus { border-color: var(--accent); }
  #sendBtn {
    background: var(--accent); color: #fff; border-radius: 10px;
    padding: 10px 16px; font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: .4; }
  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--error); color: #fff; padding: 8px 16px; border-radius: 8px;
    font-size: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw;
  }
  .conn { width: 8px; height: 8px; border-radius: 50%; background: var(--error); flex-shrink: 0; }
  .conn.ok { background: #3fb950; }
</style>
</head>
<body>

<div id="listView" class="view active">
  <header>
    <h1>Lumi</h1>
    <span class="sub" id="listSub">yükleniyor…</span>
  </header>
  <div id="list"></div>
</div>

<div id="termView" class="view">
  <header>
    <button id="backBtn" style="font-size:20px;line-height:1">‹</button>
    <div class="conn" id="connDot"></div>
    <h1 id="termName"></h1>
    <span class="sub" id="termStatus"></span>
  </header>
  <div id="exitBanner">Terminal kapandı</div>
  <div id="screenWrap"><div id="screen"><div id="history"></div><div id="live"></div></div></div>
  <div class="controls">
    <div class="keys" id="keys"></div>
    <div class="inputRow">
      <textarea id="prompt" rows="1" placeholder="Claude'a yaz…" enterkeyhint="send"></textarea>
      <button id="sendBtn">Gönder</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const STATUS_TR = {
  idle: ["idle", "var(--idle)"], working: ["çalışıyor", "var(--accent)"],
  "waiting-unseen": ["giriş bekliyor", "var(--waiting)"],
  "waiting-focused": ["giriş bekliyor", "var(--waiting)"],
  "waiting-seen": ["giriş bekliyor", "var(--waiting)"],
  error: ["hata", "var(--error)"],
};
const KEYS = [
  ["Esc", "\u001b"], ["Tab", "\t"], ["⇧Tab", "\u001b[Z"],
  ["↑", "\u001b[A"], ["↓", "\u001b[B"], ["←", "\u001b[D"], ["→", "\u001b[C"],
  ["⏎", "\r"], ["^C", "\u0003"],
];

let ws = null, currentId = null, reconnectTimer = null, listTimer = null;

// --- Liste görünümü ---
async function refreshList() {
  try {
    const res = await fetch("/api/terminals");
    const { terminals } = await res.json();
    renderList(terminals);
    $("listSub").textContent = terminals.length + " terminal";
  } catch {
    $("listSub").textContent = "bağlantı yok";
  }
}
function renderList(terminals) {
  const list = $("list");
  list.innerHTML = "";
  if (!terminals.length) {
    list.innerHTML = '<div class="empty">Açık terminal yok</div>';
    return;
  }
  for (const t of terminals) {
    const [label, color] = STATUS_TR[t.status] || [t.status, "var(--muted)"];
    const card = document.createElement("button");
    card.className = "card";
    card.innerHTML =
      '<div class="row"><span class="name"></span>' +
      '<span class="badge" style="color:' + color + ';border-color:' + color + '"></span></div>' +
      '<div class="repo"></div>' + (t.task || t.title ? '<div class="task"></div>' : "");
    card.querySelector(".name").textContent = t.name;
    card.querySelector(".badge").textContent = label;
    card.querySelector(".repo").textContent = t.repoName;
    const task = card.querySelector(".task");
    if (task) task.textContent = t.task || t.title;
    card.onclick = () => openTerminal(t);
    list.appendChild(card);
  }
}

// --- Terminal görünümü ---
function openTerminal(t) {
  currentId = t.id;
  $("termName").textContent = t.name + " · " + t.repoName;
  $("screen").textContent = "";
  $("exitBanner").style.display = "none";
  switchView("termView");
  connect();
}
function closeTerminal() {
  currentId = null;
  clearTimeout(reconnectTimer);
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  switchView("listView");
  refreshList();
}
function switchView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  $(id).classList.add("active");
  clearInterval(listTimer);
  if (id === "listView") listTimer = setInterval(refreshList, 3000);
}

function connect() {
  if (!currentId) return;
  clearTimeout(reconnectTimer);
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(proto + location.host + "/ws");
  ws.onopen = () => {
    $("connDot").classList.add("ok");
    ws.send(JSON.stringify({ type: "attach", id: currentId }));
  };
  ws.onmessage = e => handleMessage(JSON.parse(e.data));
  ws.onclose = () => {
    $("connDot").classList.remove("ok");
    if (currentId && $("exitBanner").style.display !== "block") {
      reconnectTimer = setTimeout(connect, 1500);
    }
  };
}
function handleMessage(msg) {
  if (msg.type === "snapshot") {
    const wrap = $("screenWrap");
    const pinned = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 60;
    $("history").textContent = msg.history || "";
    renderScreen(msg.screen || []);
    if (msg.terminal) {
      const [label, color] = STATUS_TR[msg.terminal.status] || [msg.terminal.status, "var(--muted)"];
      const el = $("termStatus");
      el.textContent = label;
      el.style.color = color;
    }
    if (pinned) wrap.scrollTop = wrap.scrollHeight;
  } else if (msg.type === "exited") {
    $("exitBanner").style.display = "block";
  } else if (msg.type === "error") {
    toast(msg.message);
  }
}
// Görünür ekranın stilli render'ı: her satır bir div, her koşu bir span.
// Sunucu inverse/invisible'ı çözmüş halde yollar; burada yalnız düz stil var.
function renderScreen(lines) {
  const live = $("live");
  live.innerHTML = "";
  for (const line of lines) {
    const row = document.createElement("div");
    for (const run of line) {
      const span = document.createElement("span");
      span.textContent = run.t;
      if (run.fg) span.style.color = run.fg;
      if (run.bg) span.style.backgroundColor = run.bg;
      const f = run.f || 0;
      if (f & 1) span.style.fontWeight = "700";
      if (f & 2) span.style.fontStyle = "italic";
      if (f & 8) span.style.opacity = ".65";
      const deco = [];
      if (f & 4) deco.push("underline");
      if (f & 16) deco.push("line-through");
      if (deco.length) span.style.textDecoration = deco.join(" ");
      row.appendChild(span);
    }
    live.appendChild(row);
  }
}
function sendRaw(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "input", data }));
  } else {
    toast("Bağlantı yok");
  }
}
function sendPrompt() {
  const el = $("prompt");
  const text = el.value.trim();
  if (!text) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "prompt", text }));
    el.value = "";
    el.style.height = "auto";
  } else {
    toast("Bağlantı yok");
  }
}

let toastTimer = null;
function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = 0; }, 2500);
}

// --- Kurulum ---
for (const [label, seq] of KEYS) {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = () => sendRaw(seq);
  $("keys").appendChild(b);
}
$("backBtn").onclick = closeTerminal;
$("sendBtn").onclick = sendPrompt;
$("prompt").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = e.target.scrollHeight + "px";
});
$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (currentId && (!ws || ws.readyState !== WebSocket.OPEN)) connect();
    else if (!currentId) refreshList();
  }
});
refreshList();
listTimer = setInterval(refreshList, 3000);
</script>
</body>
</html>
